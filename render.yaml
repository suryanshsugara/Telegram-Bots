services:
  - type: web
    name: bookshook-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python seed_data.py
    startCommand: python BookShook.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_CSE_ID
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: DODO_PAYMENTS_API_KEY
        sync: false
      - key: DODO_WEBHOOK_SECRET
        sync: false
      - key: DODO_PRODUCT_ID
        sync: false
      - key: BOT_MODE
        value: webhook
      - key: PORT
        value: 10000
